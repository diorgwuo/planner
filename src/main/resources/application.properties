spring.application.name=planner
spring.config.import=file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/planner
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.clear-checksums=true
spring.liquibase.enabled=true
spring.liquibase.change-log=db/changelog/master.yaml
spring.liquibase.user=dior
spring.liquibase.password=1234
spring.liquibase.url=jdbc:postgresql://localhost:5432/planner

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

logging.level.org.springframework.security=DEBUG