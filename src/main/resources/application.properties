spring.application.name=planner

spring.datasource.url=jdbc:postgresql://localhost:5432/planner
spring.datasource.username=dior
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=db/changelog/master.yaml
spring.liquibase.user=dior
spring.liquibase.password=1234
spring.liquibase.url=jdbc:postgresql://localhost:5432/planner

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

logging.level.org.springframework.security=DEBUG